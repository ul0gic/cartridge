included:
  - Cartridge

excluded:
  - .build
  - ".*"
  - Cartridge/Cores
  - Cartridge/Cartridge.xcodeproj

opt_in_rules:
  - attributes
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - contains_over_range_nil_comparison
  - discouraged_object_literal
  - empty_collection_literal
  - empty_count
  - empty_string
  - explicit_init
  - fallthrough
  - fatal_error_message
  - file_header
  - first_where
  - force_unwrapping
  - flatmap_over_map_reduce
  - identical_operands
  - implicit_return
  - joined_default_parameter
  - last_where
  - legacy_multiple
  - legacy_random
  - literal_expression_end_indentation
  - lower_acl_than_parent
  - modifier_order
  - multiline_arguments
  - multiline_function_chains
  - multiline_literal_brackets
  - multiline_parameters
  - multiline_parameters_brackets
  - operator_usage_whitespace
  - overridden_super_call
  - pattern_matching_keywords
  - prefer_self_type_over_type_of_self
  - private_action
  - private_outlet
  - prohibited_super_call
  - redundant_nil_coalescing
  - redundant_type_annotation
  - sorted_first_last
  - static_operator
  - strong_iboutlet
  - toggle_bool
  - trailing_closure
  - unavailable_function
  - unneeded_parentheses_in_closure_argument
  - vertical_parameter_alignment_on_call
  - vertical_whitespace_closing_braces
  - vertical_whitespace_opening_braces
  - yoda_condition

analyzer_rules:
  - unused_declaration
  - unused_import

attributes:
  attributes_with_arguments_always_on_line_above: false

file_header:
  forbidden_pattern: '\/\/'

trailing_comma:
  mandatory_comma: true

line_length:
  warning: 120
  error: 160
  ignores_urls: true
  ignores_interpolated_strings: true

type_body_length:
  warning: 300
  error: 400

file_length:
  warning: 500
  error: 1000

function_body_length:
  warning: 50
  error: 100

cyclomatic_complexity:
  warning: 10
  error: 20

identifier_name:
  min_length:
    warning: 2
    error: 1
  max_length:
    warning: 50
    error: 60
  excluded:
    - id
    - x
    - y

type_name:
  min_length: 3
  max_length: 50

force_unwrapping: error
force_cast: error
force_try: error
implicit_getter: error

custom_rules:
  no_emojis:
    name: "No Emojis"
    regex: '[😀-🙏🌀-🗿🚀-🛿🇠-🇿]'
    message: "No emojis in code. Use SF Symbols."
    severity: error
  no_print_statements:
    name: "No Print Statements"
    regex: '\bprint\s*\('
    message: "Use os.Logger, not print()."
    severity: error
    match_kinds:
      - identifier
  no_mark_comments:
    name: "No MARK Comments"
    regex: '//\s*MARK:'
    message: "MARK dividers are not allowed."
    severity: error

reporter: "xcode"

allow_zero_lintable_files: true
